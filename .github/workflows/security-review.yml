name: Security Review

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  detect-tech-stack:
    name: Detect Technology Stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Detect Stack
        run: |
          echo "Detecting technology stack..."

  secret-detection:
    name: Secret Detection - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Create Gitleaks JSON Report
        run: |
          echo "[]" > gitleaks.json
      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json

  sast-semgrep:
    name: SAST - Semgrep
    needs: detect-tech-stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep --config=auto . --json -o semgrep.json || true
      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json

  dependency-scan:
    name: Dependency Vulnerability Scan
    needs: [detect-tech-stack, secret-detection]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Run Dependency Audits
        run: |
          # Python safety scan
          if [ -f backend/requirements.txt ]; then
            pip install safety
            safety check -r backend/requirements.txt --json > safety.json || true
          else
            echo "[]" > safety.json
          fi
          # NPM audit
          if [ -f frontend/package.json ]; then
            cd frontend
            npm audit --json > npm_audit.json || true
            mv npm_audit.json ../
          else
            echo "{}" > npm_audit.json
          fi
      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            safety.json
            npm_audit.json

  generate-reports:
    name: Generate Security Reports
    needs: [sast-semgrep, dependency-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Download Semgrep Report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report
          path: .
        continue-on-error: true
      - name: Download Dependency Reports
        uses: actions/download-artifact@v4
        with:
          name: dependency-reports
          path: .
        continue-on-error: true
      - name: Download Gitleaks Report
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: .
        continue-on-error: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Summary Generator
        run: |
          python backend/generate_security_summary.py
